name: pipeline-tracker
services:
  web:
    build: .
    ports:
      - "127.0.0.1:19642:19641"
    volumes:
      - runs:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:19641/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  runs:
