<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Desk</title><link rel="stylesheet" href="style.css"></head>
<body><main><div class="brand"><span class="mark" aria-hidden="true">↗</span>Pipeline Desk</div>
<section class="hero"><h1><h1>Release control room<span>.</span></h1>
<p>Track each release from its first commit to a verified deployment.</p>
<ol class="route">$route</ol></section>
<div class="workspace"><aside><h2>Start a run</h2><form method="post" action="runs">
<label for="name">Release name</label><input id="name" name="name" maxlength="80" placeholder="Store API v1.2" required>
<button>Create run ↗</button></form></aside>
<section class="runs"><h2>Release runs <span>$count</span></h2>$cards</section></div></main></body></html>
